name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Write keystore.properties
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > keystore.properties <<EOF
          STOREFILE=${{ github.workspace }}/release.jks
          STOREPASS=$STOREPASS
          KEYPASS=$KEYPASS
          KEYALIAS=$KEYALIAS
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK for release
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/release/app-release.apk release-out/armadillo-android.apk

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/armadillo-android.apk
          generate_release_notes: true
