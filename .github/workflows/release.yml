name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, to link the changelog to the previous release
          fetch-depth: 0

      # Fail early, before the long build, if this tag has no CHANGELOG.md section
      - name: Check release notes exist
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release-notes.sh "$TAG" > /dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      # A tag must never publish a build whose tests fail
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :tunnel:testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Write keystore.properties
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > keystore.properties <<EOF
          STOREFILE=${{ github.workspace }}/release.jks
          STOREPASS=$STOREPASS
          KEYPASS=$KEYPASS
          KEYALIAS=$KEYALIAS
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK for release
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/release/app-release.apk release-out/armadillo-android.apk
          (cd release-out && sha256sum armadillo-android.apk > armadillo-android.apk.sha256)

      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release-notes.sh "$TAG" release-out/armadillo-android.apk.sha256 > release-notes.md

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-out/armadillo-android.apk
            release-out/armadillo-android.apk.sha256
          body_path: release-notes.md
          generate_release_notes: false
